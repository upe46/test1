<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Pages 動作テスト</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      padding: 40px;
      border-radius: 16px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    h1 {
      font-size: 24px;
      margin-bottom: 12px;
      font-weight: 700;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      background: #3b82f6;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }
    .btn:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(0);
    }
    .counter {
      margin-top: 20px;
      font-size: 14px;
      color: #cbd5e1;
    }
    .status-box {
      margin-top: 24px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">● Online</div>
    <h1>GitHub Pages 疎通テスト</h1>
    <p>Antigravityから作成されたページです。<br>この画面が正常に表示されていれば、GitHub Pagesのホスティングは成功しています！</p>
    
    <button class="btn" id="test-btn">クリックして動作テスト</button>
    <div class="counter" id="counter-text">クリック回数: 0</div>

    <div class="status-box" id="time-text">ページ読み込み完了</div>
  </div>

  <script>
    let count = 0;
    const btn = document.getElementById('test-btn');
    const counterText = document.getElementById('counter-text');
    const timeText = document.getElementById('time-text');

    timeText.textContent = '読み込み時刻: ' + new Date().toLocaleTimeString();

    btn.addEventListener('click', () => {
      count++;
      counterText.textContent = `クリック回数: ${count}`;
      btn.style.transform = 'scale(0.96)';
      setTimeout(() => { btn.style.transform = ''; }, 100);
    });
  </script>
</body>
</html>
